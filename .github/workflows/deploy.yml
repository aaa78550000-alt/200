# Manual deploy of PetOS to GitHub Pages. Runs ONLY when someone presses "Run workflow".
#   mode=demo      → fictional demo data in the browser (no backend needed)
#   mode=supabase  → creates/updates a Supabase project with the migrations (never the dev seed),
#                    deploys the Edge Functions (LINE webhook, notification worker, staff accounts) and builds against it
# Required for mode=supabase (repo Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
# Optional: SUPABASE_DB_PASSWORD (otherwise a random one is generated when the project is created; nothing here needs it later)
# One-time: Settings → Pages → Source = "GitHub Actions".
name: Deploy PetOS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo or supabase"
        required: true
        default: supabase
        type: choice
        options: [demo, supabase]
      region:
        description: "Supabase region for a new project"
        required: false
        default: ap-northeast-1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backend:
    if: inputs.mode == 'supabase'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.keys.outputs.url }}
      anon: ${{ steps.keys.outputs.anon }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; }
      - name: Find or create the "petos" project
        id: project
        run: |
          REF=$(npx supabase projects list -o json | jq -r '.[] | select(.name=="petos") | .id' | head -1)
          if [ -z "$REF" ]; then
            ORG=$(npx supabase orgs list -o json | jq -r '.[0].id')
            test -n "$ORG" -a "$ORG" != null || { echo "::error::No Supabase organization found. Log in at supabase.com once to create one."; exit 1; }
            PASS="${SUPABASE_DB_PASSWORD:-$(openssl rand -hex 24)}"
            npx supabase projects create petos --org-id "$ORG" --db-password "$PASS" --region "${{ inputs.region }}"
          fi
          for i in $(seq 1 90); do
            REF=$(npx supabase projects list -o json | jq -r '.[] | select(.name=="petos") | .id' | head -1)
            STATUS=$(npx supabase projects list -o json | jq -r '.[] | select(.name=="petos") | .status' | head -1)
            [ "$STATUS" = "ACTIVE_HEALTHY" ] && break; sleep 10
          done
          test "$STATUS" = "ACTIVE_HEALTHY" || { echo "::error::Project petos is $STATUS, not ready"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Apply migrations (no seed)
        run: node scripts/deploy-migrations.mjs "${{ steps.project.outputs.ref }}"
      - name: Deploy Edge Functions
        run: |
          REF=${{ steps.project.outputs.ref }}
          # a dedicated random secret (not the service key) lets the database call the notification worker
          WORKER_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$WORKER_SECRET"
          npx supabase secrets set --project-ref "$REF" PETOS_WORKER_SECRET="$WORKER_SECRET"
          npx supabase functions deploy --project-ref "$REF" --use-api
          SQL="delete from vault.secrets where name in ('petos_worker_url','petos_worker_key');
            select vault.create_secret('https://$REF.supabase.co/functions/v1/notify-worker', 'petos_worker_url');
            select vault.create_secret('$WORKER_SECRET', 'petos_worker_key');"
          jq -n --arg q "$SQL" '{query: $q}' | curl -fsS -o /dev/null -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @-
      - name: Expose the app schema to the API and set auth redirect
        run: |
          API=https://api.supabase.com/v1/projects/${{ steps.project.outputs.ref }}
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -fsS -X PATCH "$API/postgrest" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"db_schema":"public,graphql_public,app"}'
          curl -fsS -X PATCH "$API/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\":\"$SITE/\",\"uri_allow_list\":\"$SITE/**\"}"
      - name: Read API keys
        id: keys
        run: |
          REF=${{ steps.project.outputs.ref }}
          ANON=$(npx supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "url=https://$REF.supabase.co" >> "$GITHUB_OUTPUT"
          echo "anon=$ANON" >> "$GITHUB_OUTPUT"

  build:
    needs: [backend]
    if: always() && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build
        env:
          PAGES_REPO: ${{ github.event.repository.name }}
          VITE_DATA_MODE: ${{ inputs.mode }}
          VITE_SUPABASE_URL: ${{ needs.backend.outputs.url }}
          VITE_SUPABASE_ANON_KEY: ${{ needs.backend.outputs.anon }}
        run: |
          npx vite build --mode pages --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html   # SPA deep links on GitHub Pages
          touch dist-pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-pages }

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
